name: faro

services:
  faro:
    image: faro:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.all-in-one
    environment:
      FARO_QUERY_LOG_MAX_BYTES: ${FARO_QUERY_LOG_MAX_BYTES:-10485760}
      FARO_QUERY_LOG_BACKUPS: ${FARO_QUERY_LOG_BACKUPS:-2}
      FARO_DEVICE_CATALOG_PATH: ${FARO_DEVICE_CATALOG_PATH:-/config/device-catalog.json}
    volumes:
      # intended deployment; git clone https://github.com/codefaux/Faro.git /docker/faro/build
      # cd /docker/faro/build && docker-compose up
      - ../config:/config
    # ONE OF:
    # [--
    # networks:
    #   services:
    #     ipv4_address: x.x.x.x
    # --
    network_mode: host
    # ports:
    #   - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_UI_PORT:-1787}:1787"
    #   - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_DNS_PORT:-53}:53/udp"
    #   - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_DNS_PORT:-53}:53/tcp"
    # --]
    logging:
      driver: json-file
      options:
        max-size: "${FARO_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${FARO_DOCKER_LOG_BACKUPS:-3}"
    stop_grace_period: 20s
    restart: unless-stopped
